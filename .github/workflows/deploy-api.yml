name: Publicar API (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: database_id do D1 (vem da secret DATABASE_ID_CLOUDFLARE)
        env:
          DATABASE_ID: ${{ secrets.DATABASE_ID_CLOUDFLARE }}
        run: |
          [ -n "$DATABASE_ID" ] || { echo "Falta a secret DATABASE_ID_CLOUDFLARE no GitHub."; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$DATABASE_ID/" wrangler.toml
          grep -qF "$DATABASE_ID" wrangler.toml || { echo "Não consegui pôr o database_id no wrangler.toml (deixe o valor provisório lá)."; exit 1; }
      - name: Migrações do banco (D1)
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy do Worker
        # No primeiro deploy, a Cloudflare às vezes responde "This Worker does not exist" (código 10007)
        # logo depois do upload: o Worker foi criado, mas ainda não aparece para a leitura seguinte.
        # Tentar de novo resolve; o deploy é idempotente.
        run: |
          for tentativa in 1 2 3; do
            npx wrangler deploy && exit 0
            echo "::warning::Deploy falhou (tentativa $tentativa de 3). Tentando de novo em 20 s..."
            sleep 20
          done
          exit 1
      - name: Secrets do Worker (vindas das secrets do GitHub)
        env:
          PALAVRA_CHAVE: ${{ secrets.PALAVRA_CHAVE }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          for s in PALAVRA_CHAVE ADMIN_PASSWORD TOKEN_SECRET; do
            [ -n "${!s}" ] || { echo "Falta a secret $s no GitHub."; exit 1; }
          done
          jq -n --arg a "$PALAVRA_CHAVE" --arg b "$ADMIN_PASSWORD" --arg c "$TOKEN_SECRET" \
            '{PALAVRA_CHAVE: $a, ADMIN_PASSWORD: $b, TOKEN_SECRET: $c}' | npx wrangler secret bulk
